<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>자동 비침습 혈압계 | VDEV2</title><style>body{font-family:system-ui;margin:0;background:#f4f6f8;color:#17212b}.wrap{max-width:1180px;margin:auto;padding:24px}.head,.card{background:#fff;border:1px solid #dde3e8;border-radius:14px;padding:18px;margin-bottom:14px}.head{display:flex;justify-content:space-between;align-items:center}.badge{padding:6px 10px;border-radius:999px;background:#e8edf2}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.metric{background:#fff;border:1px solid #dde3e8;border-radius:14px;padding:20px}.metric b{font-size:36px}.wide{grid-column:1/-1}.row{display:flex;gap:10px;flex-wrap:wrap}button{padding:10px 14px;border:1px solid #aab4be;background:#fff;border-radius:9px;cursor:pointer}.ok{color:#087d38}.bad{color:#b42318}.bar{height:16px;background:#e8edf2;border-radius:99px;overflow:hidden}.bar>div{height:100%;background:#768698;width:0}.statusgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.s{padding:10px;border:1px solid #dde3e8;border-radius:9px;background:#fff}table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid #e5e9ed;text-align:left}@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}.statusgrid{grid-template-columns:1fr 1fr}}</style></head><body><div class="wrap"><div class="head"><div><h1 style="margin:0">자동 비침습 혈압계</h1><small>AUTOMATED_BP_MONITOR · Main Connector 경유</small></div><span class="badge" id="online">확인 중</span></div><div class="card"><div class="row"><button onclick="cmd('connect')">장비 연결</button><button onclick="cmd('disconnect')">연결 해제</button><button onclick="remoteMeasure()">원격 측정 시작</button><span id="measureNote"></span></div></div><div class="grid"><div class="metric"><small>수축기</small><br><b id="sys">—</b><div id="u1">mmHg</div></div><div class="metric"><small>이완기</small><br><b id="dia">—</b><div id="u2">mmHg</div></div><div class="metric"><small>평균동맥압</small><br><b id="map">—</b><div id="u3">mmHg</div></div><div class="metric"><small>맥박</small><br><b id="pulse">—</b><div>bpm</div></div><div class="card wide"><h3>측정 중 커프 압력 <span id="cuff">—</span> <span id="cu">mmHg</span></h3><div class="bar"><div id="bar"></div></div></div><div class="card wide"><h3>측정 상태</h3><div class="statusgrid" id="statuses"></div></div><div class="card wide"><h3>연결 장비 Feature</h3><div id="features">Feature 조회 대기</div></div><div class="card wide"><h3>측정 계보</h3><div id="prov">—</div></div><div class="card wide"><h3>최근 측정</h3><table><thead><tr><th>시각</th><th>SYS/DIA</th><th>MAP</th><th>Pulse</th><th>상태</th></tr></thead><tbody id="hist"></tbody></table></div></div></div><script>const API=(localStorage.bpApiBase||'http://localhost:8888')+'/devices/automated-bp-monitor';async function get(p){const r=await fetch(API+p);if(!r.ok)throw Error(r.status);return r.json()}async function post(p){const r=await fetch(API+p,{method:'POST'});return r.json()}async function cmd(x){await post('/'+x);setTimeout(refresh,300)}async function remoteMeasure(){const j=await post('/measure');measureNote.textContent=j.supported?'요청됨':'현재 upstream은 원격 START를 지원하지 않음'}function bit(label,v){return `<div class="s ${v?'bad':'ok'}">${v?'⚠':'✓'} ${label}</div>`}async function refresh(){try{const s=await get('/status');online.textContent=s.endpointState+' / '+s.transportState;online.className='badge '+(s.endpointState==='ONLINE'?'ok':'bad');const r=s.lastReading;if(r){sys.textContent=r.systolic;dia.textContent=r.diastolic;map.textContent=r.map;pulse.textContent=r.pulse??'—';u1.textContent=u2.textContent=u3.textContent=r.unit;statuses.innerHTML=bit('신체 움직임',r.status.movement)+bit('커프 장착 이상',r.status.looseCuff)+bit('불규칙 맥박',r.status.irregularPulse)+bit('맥박 범위 이상',r.status.pulseOutOfRange)+bit('측정 자세 이상',r.status.badPosition);prov.textContent=`Device timestamp: ${r.deviceTimestamp||'없음'} / User ID: ${r.userId??'없음'} / Raw: ${r.rawHex}`;}if(s.lastCuff){cuff.textContent=s.lastCuff.pressure;cu.textContent=s.lastCuff.unit;bar.style.width=Math.min(100,(Number(s.lastCuff.pressure)/200)*100)+'%'}if(s.feature){features.textContent=Object.entries(s.feature).filter(([k])=>k!=='rawHex').map(([k,v])=>`${v?'✓':'✕'} ${k}`).join('   ')}const h=await get('/readings');hist.innerHTML=h.items.slice(0,10).map(x=>`<tr><td>${x.observedAt}</td><td>${x.systolic}/${x.diastolic} ${x.unit}</td><td>${x.map}</td><td>${x.pulse??''}</td><td>${Object.entries(x.status).filter(([,v])=>v).map(([k])=>k).join(', ')||'정상'}</td></tr>`).join('')}catch(e){online.textContent='Main Connector OFFLINE';online.className='badge bad'}}setInterval(refresh,500);refresh();get('/feature').catch(()=>{});</script></body></html>
